<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BASHIRI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{box-sizing:border-box;font-family:system-ui;margin:0;padding:0}body{background:linear-gradient(135deg,#0f8a4a 0%,#d4b800 45%,#7c3aed 100%);min-height:100vh;color:#fff;padding-bottom:110px}.header{display:flex;justify-content:space-between;padding:12px;background:rgba(0,0,0,.18);backdrop-filter:blur(12px);position:sticky;top:0;z-index:30}.wallet{background:rgba(255,255,255,.22);backdrop-filter:blur(20px);margin:10px;padding:16px;border-radius:20px}.balance{font-size:34px;font-weight:900}.dep-row{display:flex;gap:6px;margin-top:10px}.dep{flex:1;padding:12px;border-radius:12px;border:0;font-weight:800;cursor:pointer}.g{background:linear-gradient(135deg,#00ff88,#00cc66);color:#000}.r{background:linear-gradient(135deg,#ff6b6b,#ff2e2e);color:#fff}.y{background:linear-gradient(135deg,#ffeb3b,#ffcc00);color:#000}.send{background:rgba(255,255,255,.2);margin:10px;padding:14px;border-radius:20px}.input{width:100%;padding:12px;border-radius:10px;border:0;margin:6px 0;background:#fff;color:#000;font-weight:600}.btn{padding:12px;width:100%;border-radius:12px;border:0;font-weight:800;cursor:pointer}.btn-purple{background:linear-gradient(90deg,#6a5af9,#8a2be2);color:#fff}.card{background:rgba(0,0,0,.18);margin:10px;padding:12px;border-radius:18px}.bar{height:8px;background:rgba(0,0,0,.35);border-radius:10px;display:flex;overflow:hidden;margin:6px 0}.by{background:#00ff88}.bn{background:#ff6b6b}.small{font-size:11px;opacity:.9}.badge{background:#fff;color:#000;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:800}.tabs{position:fixed;bottom:10px;left:10px;right:10px;background:rgba(255,255,255,.92);display:flex;border-radius:20px;padding:5px;z-index:40}.tab{flex:1;text-align:center;color:#666;font-size:10px;padding:8px 2px;border-radius:14px;font-weight:700;cursor:pointer}.tab.active{background:#00ff88;color:#000}.view{display:none}.view.active{display:block}.toast{position:fixed;top:55px;left:10px;right:10px;background:#fff;color:#000;padding:10px;border-radius:12px;text-align:center;font-weight:800;display:none;z-index:99}</style>
</head><body>
<div class="toast" id="toast"></div>
<div class="header"><div><b>⭐ BASHIRI</b><div class="small">Weka 20 Shinda • 0116982197</div></div><div style="text-align:right"><span class="badge" id="topBal">KES 0</span><br><span class="small">Min 20 | Wd 100</span></div></div>
<div id="v-home" class="view active"><div id="homeList"></div></div>
<div id="v-local" class="view"><div class="card"><h3>🌧️ Local Markets - Cloud</h3><div class="small">From Admin instantly</div></div><div id="localList"></div></div>
<div id="v-forex" class="view"><div class="card"><h3>📈 Forex</h3></div><div id="forexList"></div></div>
<div id="v-wallet" class="view"><div class="send"><h3>✈️ Wallet 0116982197</h3><div style="background:#fff;color:#000;padding:10px;border-radius:10px;font-weight:900;font-size:18px">📞 0116982197</div><div class="dep-row"><button class="dep g" onclick="dep(20)">20</button><button class="dep y" onclick="dep(50)">50</button><button class="dep g" onclick="dep(100)">100</button><button class="dep y" onclick="dep(500)">500</button></div><input id="mpesaCode" class="input" placeholder="M-Pesa Code"><button class="btn btn-purple" onclick="confirmDep()">Confirm Deposit</button><div style="margin-top:12px"><h4>Withdraw 100+</h4><input id="wdAmt" class="input" type="number" placeholder="Amount"><input id="wdPhone" class="input" placeholder="07..."><button class="btn" style="background:#fff;color:#000" onclick="withdraw()">Request Withdraw</button></div></div></div>
<div class="tabs"><div class="tab active" id="t-home" onclick="sw('home')">🏠<br>Home</div><div class="tab" id="t-local" onclick="sw('local')">🌧️<br>Local</div><div class="tab" id="t-forex" onclick="sw('forex')">📈<br>Forex</div><div class="tab" id="t-wallet" onclick="sw('wallet')">👛<br>Wallet</div></div>
<script>
const SUPABASE_URL = "https://hkhqbtyyqgvaktamilxs.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhraHFidHl5cWd2YWt0YW1pbHhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwMTQwNDQsImV4cCI6MjEwNjU5MDA0NH0.gJcUf9XgzF34sczhD79V9oOnPD7a3XEU-5BXoQHWuAg";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let localBal = parseInt(localStorage.getItem('bashiri_bal')||'0');
let selDep=null;
function toast(m){let t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500);}
function sw(v){document.querySelectorAll('.view').forEach(e=>e.classList.remove('active'));document.getElementById('v-'+v).classList.add('active');document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));document.getElementById('t-'+v).classList.add('active');}
function dep(a){selDep=a;sw('wallet');toast('Send '+a+' to 0116982197');}
async function confirmDep(){let c=document.getElementById('mpesaCode').value.trim();if(!selDep)return toast('Tap 20/50/100/500');if(!c)return toast('Paste code');await supabase.from('transactions').insert({type:'deposit',amount:selDep,mpesa_code:c,status:'pending'});localBal+=selDep;localStorage.setItem('bashiri_bal',localBal);document.getElementById('mpesaCode').value='';selDep=null;toast('Deposit +'+localBal);renderBal();}
async function withdraw(){let a=parseInt(document.getElementById('wdAmt').value);let p=document.getElementById('wdPhone').value;if(a<100)return toast('Min 100');if(a>localBal)return toast('Low balance');await supabase.from('transactions').insert({type:'withdraw',amount:a,phone:p,status:'pending'});localBal-=a;localStorage.setItem('bashiri_bal',localBal);toast('Withdraw requested');renderBal();}
async function bet(marketId, side){if(localBal<20){sw('wallet');return toast('Deposit min 20');}let {data:m}=await supabase.from('markets').select('*').eq('id',marketId).single();let total=(m.yes_count||0)+(m.no_count||0);let yesPct= total? Math.round((m.yes_count/total)*100):50;if(side==='YES' && yesPct>=60)return toast('YES FULL 60% cap, bet NO');if(side==='NO' && yesPct<=40)return toast('NO FULL, bet YES');await supabase.from('bets').insert({market_id:marketId,side:side,amount:20});if(side==='YES') await supabase.from('markets').update({yes_count:m.yes_count+1,pool:(m.pool||0)+20}).eq('id',marketId);else await supabase.from('markets').update({no_count:m.no_count+1,pool:(m.pool||0)+20}).eq('id',marketId);localBal-=20;localStorage.setItem('bashiri_bal',localBal);toast(side+' bet 20 placed');loadMarkets();renderBal();}
function renderBal(){document.getElementById('topBal').innerText='KES '+localBal;}
async function loadMarkets(){let {data:markets}=await supabase.from('markets').select('*').order('created_at',{ascending:false});if(!markets)return;let home=markets.filter(m=>m.type==='home' && !m.settled);let local=markets.filter(m=>m.type==='local' && !m.settled);let forex=markets.filter(m=>m.type==='forex' && !m.settled);document.getElementById('homeList').innerHTML=home.map(m=>{let tot=(m.yes_count||0)+(m.no_count||0)||1;let yp=Math.round((m.yes_count||0)/tot*100);return `<div class="card"><h4>${m.question}</h4><div class="small">Pool KES ${m.pool} • YES ${m.yes_count}/6 NO ${m.no_count}/4</div><div class="bar"><div class="by" style="width:${yp}%"></div><div class="bn" style="width:${100-yp}%"></div></div><div class="dep-row"><button class="dep g" onclick="bet('${m.id}','YES')">YES 20 - ${yp}%</button><button class="dep r" onclick="bet('${m.id}','NO')">NO 20 - ${100-yp}%</button></div></div>`;}).join('')||'<div class="card">No active Home - Admin will publish</div>';document.getElementById('localList').innerHTML=local.map(m=>{let tot=(m.yes_count||0)+(m.no_count||0)||1;let yp=Math.round((m.yes_count||0)/tot*100);return `<div class="card"><b>${m.question}</b><div class="small">Pool ${m.pool}</div><div class="bar"><div class="by" style="width:${yp}%"></div><div class="bn" style="width:${100-yp}%"></div></div><div class="dep-row"><button class="dep g" onclick="bet('${m.id}','YES')">YES 20</button><button class="dep r" onclick="bet('${m.id}','NO')">NO 20</button></div></div>`;}).join('');document.getElementById('forexList').innerHTML=forex.map(m=>{let tot=(m.yes_count||0)+(m.no_count||0)||1;let yp=Math.round((m.yes_count||0)/tot*100);return `<div class="card"><b>${m.question}</b><div class="bar"><div class="by" style="width:${yp}%"></div><div class="bn" style="width:${100-yp}%"></div></div><div class="dep-row"><button class="dep g" onclick="bet('${m.id}','YES')">UP 20</button><button class="dep r" onclick="bet('${m.id}','NO')">DOWN 20</button></div></div>`;}).join('');}
renderBal();loadMarkets();setInterval(loadMarkets,5000);
</script></body></html>
