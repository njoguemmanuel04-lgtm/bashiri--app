<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BASHIRI FINAL 5MIN FIXED</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://s3.tradingview.com/tv.js"></script>
<style>
body{background:#0a0a0a;color:#fff;font-family:system-ui;margin:0;padding:10px}
.top{display:flex;justify-content:space-between;align-items:center;background:#111;padding:12px;border-radius:12px;border:1px solid #222}
.card{background:#111;border:1px solid #222;border-radius:14px;padding:12px;margin:10px 0}
.btn{padding:12px 18px;border-radius:10px;border:0;font-weight:900;cursor:pointer}
.gold{background:#d4af37;color:#000}.dark{background:#222;color:#fff}
.green{background:#00ff88;color:#000}.red{background:#ff184e;color:#fff}
input{width:100%;padding:14px;background:#000;color:#fff;border:1px solid #333;border-radius:10px;margin:8px 0;box-sizing:border-box}
.tab{display:none}.tab.active{display:block}
.countdown{font-size:22px;font-weight:900;color:#d4af37}
</style>
</head><body>
<div class="top"><b style="color:#d4af37">BASHIRI 🔮 0116982197</b><b id="bal">Bal: KES 0</b></div>
<div style="display:flex;gap:8px;margin:12px 0">
<button class="btn gold" style="flex:1" onclick="showTab('markets')">Markets</button>
<button class="btn dark" style="flex:1" onclick="showTab('wallet')">Wallet</button>
<button class="btn dark" style="flex:1" onclick="showTab('forex')">Forex 5M</button>
</div>
<div id="tab-markets" class="tab active"><div id="marketsList" class="card">Loading...</div></div>
<div id="tab-wallet" class="tab"><div class="card"><h3>Deposit Till 0116982197</h3><input id="depAmt" placeholder="Amount"><button class="btn gold" onclick="deposit()">I Paid</button><h3>Withdraw</h3><input id="withAmt" placeholder="Amount"><input id="withPhone" placeholder="07..."><button class="btn dark" onclick="withdraw()">Request</button></div></div>
<div id="tab-forex" class="tab">
<div class="card">
<div style="display:flex;justify-content:space-between"><b>EUR/USD REAL 5MIN</b><b id="liveFxPrice" style="color:#00ff88">Loading...</b></div>
<div style="font-size:11px;color:#888">REAL TwelveData - 5 MIN MUST WAIT - NO DRAW</div>
<div id="tv" style="height:260px;margin:10px 0"></div>
<input id="fxAmt" value="20" type="number"><small>Min 20 - Win 1.6x - Waits Full 5 Min</small>
<div style="display:flex;gap:10px;margin-top:10px"><button class="btn green" style="flex:1" onclick="tradeFx('BUY')">BUY ↑</button><button class="btn red" style="flex:1" onclick="tradeFx('SELL')">SELL ↓</button></div>
</div>
<div class="card" style="border:2px solid #d4af37"><h3>Active Sessions (5 MIN) - LIVE COUNTDOWN ⏳</h3><div id="fxActive">No active</div></div>
<div class="card"><h3>Closed Sessions</h3><div id="fxClosed">Loading...</div></div>
</div>
<script>
const SUPABASE_URL='https://hkhqbtyyqgvaktamilxs.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhraHFidHl5cWd2YWt0YW1pbHhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwMTQwNDQsImV4cCI6MjEwNjU5MDA0NH0.gJcUf9XgzF34sczhD79V9oOnPD7a3XEU-5BXoQHWuAg';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const USER_ID=localStorage.getItem('bashiri_uid')||crypto.randomUUID(); localStorage.setItem('bashiri_uid',USER_ID);
let LIVE_PRICE=1.12005;
// LOCAL EXPIRY - THIS IS THE FIX - MUST WAIT 5 MIN
let EXPIRY_MAP = JSON.parse(localStorage.getItem('bashiri_expiry_v2')||'{}');
function saveExpiry(){localStorage.setItem('bashiri_expiry_v2',JSON.stringify(EXPIRY_MAP));}

function showTab(t){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById('tab-'+t).classList.add('active');if(t=='forex')initChart();if(t=='markets')loadMarkets();}
async function fetchRealPrice(){try{let r=await fetch(`https://api.twelvedata.com/price?symbol=EUR/USD&apikey=demo`);let j=await r.json();if(j.price){LIVE_PRICE=parseFloat(j.price);document.getElementById('liveFxPrice').innerHTML=LIVE_PRICE.toFixed(5)+' ● REAL '+new Date().toLocaleTimeString();return;}}catch(e){} LIVE_PRICE+=(Math.random()-0.5)*0.0001; document.getElementById('liveFxPrice').innerHTML=LIVE_PRICE.toFixed(5)+' ● LIVE';}
setInterval(fetchRealPrice,3000);fetchRealPrice();
function initChart(){new TradingView.widget({autosize:true,symbol:"FX:EURUSD",interval:"1",timezone:"Africa/Nairobi",theme:"dark",style:"1",container_id:"tv",hide_top_toolbar:true});}
async function loadBal(){let {data}=await sb.from('profiles').select('balance').eq('id',USER_ID).single();if(!data){await sb.from('profiles').insert([{id:USER_ID,balance:20}]);data={balance:20};}document.getElementById('bal').innerText='Bal: KES '+data.balance;return data.balance;}
async function loadMarkets(){let {data}=await sb.from('markets').select('*').eq('status','OPEN').order('created_at',{ascending:false});document.getElementById('marketsList').innerHTML=data.map(m=>`<div class="card"><b>${m.title}</b><br><div style="display:flex;gap:8px;margin-top:8px"><button class="btn green" onclick="bet('${m.id}','YES',20)">YES</button><button class="btn red" onclick="bet('${m.id}','NO',20)">NO</button></div></div>`).join('')||'No markets';}
async function bet(mid,choice,amt){let bal=await loadBal();if(bal<amt)return alert('Low');document.getElementById('bal').innerText='Bal: KES '+(bal-amt);await sb.from('profiles').update({balance:bal-amt}).eq('id',USER_ID);await sb.from('bets').insert([{user_id:USER_ID,market_id:mid,choice:choice,amount:amt,status:'active'}]);loadBal();}

async function tradeFx(type){
 let amt=parseInt(document.getElementById('fxAmt').value)||20;
 let {data:prof}=await sb.from('profiles').select('balance').eq('id',USER_ID).single();
 if(!prof){await sb.from('profiles').insert([{id:USER_ID,balance:20}]);prof={balance:20};}
 if(prof.balance<amt)return alert('Low KES '+prof.balance);
 let newBal=prof.balance-amt; document.getElementById('bal').innerText='Bal: KES '+newBal;
 let entry=LIVE_PRICE; let expiry = Date.now()+5*60*1000; // 5 MIN FROM NOW - FIXED
 let {data:ins}=await sb.from('bets').insert([{user_id:USER_ID,market_id:'forex-eurusd',choice:type+' EUR/USD @ '+entry.toFixed(5),amount:amt,status:'active',entry_price:entry,pair:'EUR/USD',direction:type}]).select().single();
 await sb.from('profiles').update({balance:newBal}).eq('id',USER_ID);
 if(ins){EXPIRY_MAP[ins.id]=expiry; saveExpiry();}
 loadFxBets();
}

async function loadFxBets(){
 let {data}=await sb.from('bets').select('*').eq('user_id',USER_ID).eq('market_id','forex-eurusd').order('created_at',{ascending:false}).limit(50);
 if(!data)return; let now=Date.now(); let active='',closed='';
 for(let b of data){
   let entry=b.entry_price||LIVE_PRICE;
   // USE LOCAL EXPIRY IF EXISTS - THIS PREVENTS INSTANT WIN
   let expiry = EXPIRY_MAP[b.id];
   if(!expiry){ // if no local expiry (old trade or new device), use created_at + 5min but NEVER instant close
     let created=new Date(b.created_at).getTime();
     expiry = created+5*60*1000;
     // if created is too old or invalid, force at least 5 min from now for brand new trades that are still active
     if(b.status=='active' && (isNaN(expiry) || expiry < now-10*60*1000)){ // if older than 10min, close it
       expiry = now-1000; // will close
     } else if(b.status=='active' && isNaN(expiry)){
       expiry = now+5*60*1000; EXPIRY_MAP[b.id]=expiry; saveExpiry();
     }
   }
   let leftMs = expiry - now;
   // ONLY CLOSE AFTER 5 MIN EXPIRED
   if(b.status=='active' && leftMs<=0){
     let won=false;
     if(b.direction=='BUY') won = LIVE_PRICE > entry;
     else if(b.direction=='SELL') won = LIVE_PRICE < entry;
     if(LIVE_PRICE==entry) won = (b.direction=='BUY'); // NO DRAW - BUY wins on equal
     await sb.from('bets').update({status:won?'won':'lost',exit_price:LIVE_PRICE}).eq('id',b.id);
     if(won){let {data:prof}=await sb.from('profiles').select('balance').eq('id',USER_ID).single(); if(prof) await sb.from('profiles').update({balance:prof.balance+Math.floor(b.amount*1.6)}).eq('id',USER_ID);}
     b.status=won?'won':'lost'; b.exit_price=LIVE_PRICE;
     delete EXPIRY_MAP[b.id]; saveExpiry();
   }
   let diff=LIVE_PRICE-entry;
   if(b.status=='active'){
     let mins=Math.max(0,Math.floor(leftMs/60000)); let secs=Math.max(0,Math.floor((leftMs%60000)/1000)); let totalSec=Math.max(0,Math.floor(leftMs/1000));
     // If leftMs negative due to old bug, show 0 and close next loop
     if(leftMs<0){mins=0; secs=0; totalSec=0;}
     let badge=diff==0?'⚪ SAME':(b.direction=='BUY'&&diff>0)||(b.direction=='SELL'&&diff<0)?`🟢 WINNING ${diff>0?'+':''}${diff.toFixed(5)}`:`🔴 LOSING ${diff.toFixed(5)}`;
     active+=`<div class="card" style="border-color:#d4af37;background:#1a1a00"><b>${b.direction} EUR/USD KES ${b.amount} @ ${entry.toFixed(5)}</b><br><div class="countdown">⏳ ${mins}m ${secs}s left (${totalSec}s) / 5:00 MUST WAIT</div><div>Live ${LIVE_PRICE.toFixed(5)} | ${badge}</div><div style="background:#333;height:8px;border-radius:4px;margin-top:6px"><div style="background:#d4af37;height:8px;width:${Math.max(0,Math.min(100,(leftMs/(5*60*1000))*100))}%"></div></div></div>`;
   } else {
     let col=b.status=='won'?'#00ff88':'#ff184e'; let bg=b.status=='won'?'#00ff8811':'#ff184e22'; let sign=b.status=='won'?'+'+Math.floor(b.amount*1.6):'-'+b.amount;
     closed+=`<div class="card" style="border-color:${col};background:${bg}"><b>${b.status.toUpperCase()} ${b.direction} ${sign} | Entry ${entry.toFixed(5)} → Exit ${(b.exit_price||LIVE_PRICE).toFixed(5)}</b><br><small>${b.choice}</small></div>`;
   }
 }
 document.getElementById('fxActive').innerHTML=active||'No active - Place BUY/SELL. Will stay 5 min even if you close app.';
 document.getElementById('fxClosed').innerHTML=closed||'No closed'; loadBal();
}
setInterval(loadFxBets,1000);
loadBal();loadMarkets();loadFxBets();initChart();
async function deposit(){let a=parseInt(document.getElementById('depAmt').value);if(!a)return;alert('Send KES '+a+' to Till 0116982197');}
async function withdraw(){let a=parseInt(document.getElementById('withAmt').value);let p=document.getElementById('withPhone').value;if(!a||!p)return alert('Fill');await sb.from('withdrawals').insert([{user_id:USER_ID,amount:a,phone:p,status:'pending'}]);alert('Requested');}
</script></body></html>
