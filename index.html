<!DOCTYPE html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BASHIRI Till 0116982197</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{background:#0a0a0a;color:#fff;font-family:system-ui;margin:0;padding:12px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.card{background:#111;border:1px solid #222;border-radius:14px;padding:14px;margin:12px 0}
.btn{padding:10px 14px;border-radius:12px;border:none;font-weight:800;cursor:pointer}
.gold{background:#d4af37;color:#000} .dark{background:#222;color:#fff;border:1px solid #333}
.yes{background:#d4af37;color:#000;padding:10px 16px;border-radius:12px;border:none;font-weight:800}
.no{background:#222;color:#fff;padding:10px 16px;border-radius:12px;border:1px solid #333;font-weight:800}
small{color:#888}
</style>
</head><body>
<div class="top">
<div><b style="color:#d4af37;font-size:20px">BASHIRI</b> <span style="background:#1a1a1a;border:1px solid #333;padding:6px 10px;border-radius:10px;color:#d4af37">Till 0116982197</span></div>
<div id="bal" style="font-weight:800">Bal: KES 20</div>
</div>
<div style="display:flex;gap:8px;margin:12px 0">
<button class="btn gold" onclick="show('markets')">Markets</button>
<button class="btn dark" onclick="show('wallet')">Wallet</button>
<button class="btn dark" onclick="location.href='admin.html'">Admin</button>
</div>
<div id="view-markets"></div>
<div id="view-wallet" style="display:none" class="card"><h3>Wallet - Till 0116982197</h3><p>Balance: <b id="bal2">20</b></p></div>
<script>
const SUPABASE_URL='https://hkhqbtyyqgvaktamilxs.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhraHFidHl5cWd2YWt0YW1pbHhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwMTQwNDQsImV4cCI6MjEwNjU5MDA0NH0.gJcUf9XgzF34sczhD79V9oOnPD7a3XEU-5BXoQHWuAg';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let USER_ID=localStorage.getItem('bashiri_uid');
if(!USER_ID){ USER_ID=crypto.randomUUID(); localStorage.setItem('bashiri_uid',USER_ID); }
let USER_BAL=20;
async function init(){
 let {data:prof}=await sb.from('profiles').select('*').eq('id',USER_ID).single();
 if(!prof){ await sb.from('profiles').insert([{id:USER_ID,balance:20}]); USER_BAL=20; } else USER_BAL=prof.balance||20;
 document.getElementById('bal').innerText='Bal: KES '+USER_BAL;
 document.getElementById('bal2').innerText=USER_BAL;
 loadMarkets();
}
function show(v){
 document.getElementById('view-markets').style.display=v=='markets'?'block':'none';
 document.getElementById('view-wallet').style.display=v=='wallet'?'block':'none';
}
async function loadMarkets(){
 let {data}=await sb.from('markets').select('*').order('created_at',{ascending:false});
 document.getElementById('view-markets').innerHTML=data.map(m=>`
  <div class="card">
  <b>${m.title}</b> - <span style="color:#00ff88">${m.status||'open'}</span> <small>• ${new Date(m.created_at).toLocaleDateString()}</small>
  <div style="display:flex;gap:10px;margin-top:10px">
  <button class="yes" onclick="placeBet('${m.id}','yes')">YES 20 → Win 12</button>
  <button class="no" onclick="placeBet('${m.id}','no')">NO 20 → Win 12</button>
  </div></div>`).join('');
}
async function placeBet(market_id,choice){
 if(USER_BAL<20) return alert('Low balance');
 USER_BAL-=20;
 document.getElementById('bal').innerText='Bal: KES '+USER_BAL;
 document.getElementById('bal2').innerText=USER_BAL;
 await sb.from('profiles').update({balance:USER_BAL}).eq('id',USER_ID);
 let {error}=await sb.from('bets').insert([{user_id:USER_ID,market_id:market_id,choice:choice,amount:20,status:'pending'}]);
 if(error){
  // try with stake column if amount fails
  let {error:e2}=await sb.from('bets').insert([{user_id:USER_ID,market_id:market_id,choice:choice,stake:20,status:'pending'}]);
  if(e2){ alert('Bet failed: '+e2.message); USER_BAL+=20; await sb.from('profiles').update({balance:USER_BAL}).eq('id',USER_ID); document.getElementById('bal').innerText='Bal: KES '+USER_BAL; return; }
 }
 alert('Bet placed! Gold YES 20 saved. Go to Admin → Bets');
}
init();
</script>
</body></html>
