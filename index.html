<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BASHIRI v11 FIXED - BOTH SIDES</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#0a0a0a;color:#fff;padding:10px}
#splash{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;transition:opacity.6s}
.b-circle{width:115px;height:115px;background:#0F7A3D;border-radius:50%;display:flex;align-items:center;justify-content:center;animation:pulse 1.2s infinite}
.b-letter{font:900 74px Arial Black;color:#111}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
.top{display:flex;justify-content:space-between;background:#151515;padding:12px;border-radius:12px;margin-bottom:10px}
.bal{font-weight:900} #bal{color:#0F7A3D}
.botsec{margin:14px 0}.bottitle{color:#0F7A3D;font-weight:800;font-size:12px;margin-bottom:6px}
.row{display:flex;justify-content:space-between;align-items:center;background:#1c1c1c;padding:11px;border-radius:10px;margin:6px 0}
.tog{padding:7px 16px;border:none;border-radius:8px;background:#333;color:#fff;font-weight:900}
.tog.on{background:#0F7A3D}
.inp{padding:10px;border-radius:8px;border:none;background:#2a2a2a;color:#fff}
.r-head{display:flex;justify-content:space-between;margin:12px 0 6px}
</style>
</head>
<body>

<div id="splash"><div class="b-circle"><div class="b-letter">B</div></div><h1 style="color:#111;font:900 38px Arial;margin-top:14px">Bashiri</h1></div>

<div class="top"><div class="bal">💰 KES <span id="bal">1051</span></div><div id="phoneDisp" style="font-size:11px;color:#888">0116982197</div><div id="cloudStat" style="font-size:11px;color:#00e676">Cloud: CONNECTING...</div></div>

<div class="botsec"><div class="bottitle">EVEN/ODD BOTS - FIXED BOTH SIDES</div>
<div class="row"><span>🛡️ Safe Base 5→+7</span><button class="tog" id="tog-safe" onclick="toggleBot('safe','even')">OFF</button></div>
<div class="row"><span>⚡ Mart Base 5→+7</span><button class="tog" id="tog-mart" onclick="toggleBot('mart','even')">OFF</button></div>
<div class="row"><span>🔥 Agg Base 10→+5</span><button class="tog" id="tog-agg" onclick="toggleBot('agg','even')">OFF</button></div>
</div>

<div class="botsec"><div class="bottitle">OVER/UNDER BOTS - FIXED BOTH SIDES</div>
<div class="row"><span>🛡️ Safe OU Base 5→+2</span><button class="tog" id="tog-safeOU" onclick="toggleBot('safeOU','over')">OFF</button></div>
<div class="row"><span>⚡ Mart OU Base 5→+2</span><button class="tog" id="tog-martOU" onclick="toggleBot('martOU','over')">OFF</button></div>
<div class="row"><span>🔥 Agg OU Base 10→+5</span><button class="tog" id="tog-aggOU" onclick="toggleBot('aggOU','over')">OFF</button></div>
</div>

<div style="display:flex;gap:6px;margin:14px 0"><input id="depInp" class="inp" style="flex:1" placeholder="Amount"><button onclick="BAL+=parseInt(depInp.value)||0;document.getElementById('bal').innerText=BAL" style="padding:10px 16px;background:#0F7A3D;border:none;border-radius:8px;color:#fff;font-weight:800">M-Pesa</button></div>

<div class="r-head"><span id="rTitle">RESULTS (0)</span><button onclick="localStorage.removeItem('bashiri_results');location.reload()" style="background:none;border:none;color:#777">CLEAR</button></div>
<div id="resultsList"></div>

<script>
const SUPA_URL="https://hkhqbtyyqgvaktamilxs.supabase.co";
const SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhraHFidHl5cWd2YWt0YW1pbHhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwMTQwNDQsImV4cCI6MjEwNjU5MDA0NH0.gJcUf9XgzF34sczhD79V9oOnPD7a3XEU-5BXoQHWuAg";
const supa=window.supabase.createClient(SUPA_URL,SUPA_KEY);
let PHONE=localStorage.getItem('phone')||'0116982197';
let BAL=1051, hist=[0,1,0,2,0,1,3,7,4,2,1,0,0,5,8,0,1], intervals={}, results=JSON.parse(localStorage.getItem('bashiri_results')||'[]');
document.getElementById('phoneDisp').innerText=PHONE;
supa.from('bets').select('id').limit(1).then(r=>{document.getElementById('cloudStat').innerText=r.error?'Cloud: '+r.error.message:'Cloud: CONNECTED 100% v11 NEW KEY'});

function calcPayout(s,isEven){s=Math.max(5,parseInt(s)||5); if(isEven){if(s===5)return{profit:7,payout:12}; if(s<50)return{profit:s+2,payout:s*2+2}; return{profit:Math.floor(s*0.91),payout:s+Math.floor(s*0.91)}} else {if(s===5)return{profit:5,payout:10}; if(s<50)return{profit:s+5,payout:s*2+5}; return{profit:Math.floor(s*0.95),payout:s+Math.floor(s*0.95)}}}
function addResult(type,d,profit,win){results.unshift({type,d,profit,win}); if(results.length>100)results.pop(); localStorage.setItem('bashiri_results',JSON.stringify(results)); let list=document.getElementById('resultsList'); list.innerHTML=results.map(r=>`<div style="display:flex;justify-content:space-between;padding:7px;margin:3px 0;background:#151515;border-left:3px solid ${r.win?'#0F7A3D':'#ff4444'};border-radius:6px;font-size:13px"><span>${r.win?'✅':'❌'} ${r.type.toUpperCase()} D:${r.d}</span><span style="color:${r.win?'#0F7A3D':'#ff4444'}">${r.profit>0?'+':''}${r.profit}</span></div>`).join(''); document.getElementById('rTitle').innerText=`RESULTS (${results.length})`}

function toggleBot(name,baseType){
 let el=document.getElementById('tog-'+name); let isOff=el.innerText==='OFF'; el.innerText=isOff?'ON':'OFF'; el.className=isOff?'tog on':'tog';
 if(isOff){
   intervals[name]=setInterval(async()=>{
     let base=name.includes('agg')?10:5;
     let tradeType=baseType;
     // FIXED: Trade BOTH sides
     if(name.includes('OU')){
       tradeType = hist[0]<=4? 'over' : 'under';
     }else{
       tradeType = hist[0]%2===0? 'odd' : 'even';
     }
     let d=Math.floor(Math.random()*10);
     let win=false;
     if(tradeType==='over') win=d>=5;
     else if(tradeType==='under') win=d<=4;
     else if(tradeType==='even') win=d%2===0;
     else if(tradeType==='odd') win=d%2===1;
     let isEvenTrade=tradeType==='even'||tradeType==='odd';
     let p=calcPayout(base,isEvenTrade);
     let profit=win?p.profit:-base;
     BAL+=profit; document.getElementById('bal').innerText=BAL;
     hist.unshift(d); hist=hist.slice(0,30);
     addResult(tradeType,d,profit,win);
     try{await supa.from('bets').insert([{phone:PHONE,type:tradeType,digit:d,profit,win,stake:base}])}catch(e){}
   },2000);
 }else{ clearInterval(intervals[name]); }
}
addResult('init',hist[0],0,true);
setTimeout(()=>{let s=document.getElementById('splash'); s.style.opacity=0; setTimeout(()=>s.remove(),600)},2500);
</script>
</body>
</html>
