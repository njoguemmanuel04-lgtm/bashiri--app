<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BASHIRI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{box-sizing:border-box;font-family:Inter,system-ui;margin:0;padding:0}
body{background:#f2f4f7;min-height:100vh;color:#111;padding-bottom:90px}
.header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:30}
.b-logo{width:36px;height:36px;background:linear-gradient(135deg,#f59e0b,#ef4444);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900}
.badge{background:#111;color:#fff;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:800}
.card-light{background:#fff;border-radius:16px;margin:10px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.06);border:1px solid #eef}
.pred-badge{display:inline-block;background:#eef2ff;color:#4f46e5;padding:4px 8px;border-radius:6px;font-size:10px;font-weight:800;letter-spacing:.5px}
.yes-box{background:#dcfce7;color:#166534;padding:6px 12px;border-radius:10px;font-weight:800;display:inline-flex;align-items:center;gap:6px}
.no-box{background:#fecaca;color:#991b1b;padding:6px 12px;border-radius:10px;font-weight:800;display:inline-flex;align-items:center;gap:6px}
.pot{font-weight:900}
.time-bar{border:1px solid #e5e7eb;border-radius:10px;padding:8px 12px;display:flex;gap:8px;margin:8px 0;background:#fafafa}
.time-bar button{flex:1;border:0;padding:6px;border-radius:8px;font-weight:700;cursor:pointer}
.time-bar .active{background:#2563eb;color:#fff}
.chart-box{height:200px;position:relative;margin:10px 0}
.volume-bars{display:flex;align-items:end;gap:3px;height:70px;margin:10px 0}
.vb{flex:1;border-radius:3px 3px 0 0}
.bet-box{border:1px solid #e5e7eb;border-radius:16px;padding:14px;margin-top:10px;background:#fff}
.bet-row{display:flex;align-items:center;gap:10px;margin:10px 0}
.bet-ctrl{display:flex;align-items:center;gap:8px;border:1px solid #e5e7eb;border-radius:12px;padding:4px;flex:1}
.bet-ctrl button{width:32px;height:32px;border-radius:8px;border:0;background:#f3f4f6;font-weight:900;cursor:pointer}
.bet-btn{flex:1;padding:14px;border-radius:12px;border:0;font-weight:900;cursor:pointer}
.yes-bet{background:#1d4ed8;color:#fff}
.no-bet{background:#9ca3af;color:#fff}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e7eb;display:flex;padding:8px;z-index:40}
.tab{flex:1;text-align:center;color:#9ca3af;font-size:11px;font-weight:600;cursor:pointer;padding:6px;border-radius:12px}
.tab.active{color:#111;font-weight:800;background:#f3f4f6}
.toast{position:fixed;top:70px;left:10px;right:10px;background:#111;color:#fff;padding:12px;border-radius:12px;text-align:center;font-weight:800;display:none;z-index:99}
.view{display:none}.view.active{display:block}
/* Forex dark kept */
.forex-dark{background:#0a0e1a;min-height:80vh;border-radius:20px;margin:10px;overflow:hidden;color:#fff}
.f-top{display:flex;justify-content:space-between;padding:14px;background:#0f1424;font-weight:900}
.f-cards{display:flex;gap:8px;padding:10px;overflow-x:auto}
.f-card{min-width:115px;padding:12px;border-radius:12px;background:#1a2035;cursor:pointer;text-align:center;border:1px solid transparent}
.f-card.active{border-color:#00e5ff;background:#162040}
.f-up{color:#00e676}.f-down{color:#ff5252}
.f-chart-wrap{height:260px;padding:10px}
.f-stats{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;padding:12px;background:#0f1424;font-size:11px;text-align:center}
.pred-bar{height:36px;background:#3a1a1a;border-radius:20px;display:flex;overflow:hidden;margin:10px 0}
.pred-yes{background:linear-gradient(90deg,#00e676,#00bcd4);display:flex;align-items:center;justify-content:center;font-weight:900}
.pred-no{background:#5a2a2a;display:flex;align-items:center;justify-content:center;flex:1}
.btn-sell{flex:1;padding:14px;border-radius:12px;border:2px solid #00e5ff;background:transparent;color:#00e5ff;font-weight:900;cursor:pointer}
.btn-buy{flex:1;padding:14px;border-radius:12px;border:0;background:#00e5ff;color:#000;font-weight:900;cursor:pointer}
.dep{flex:1;padding:12px;border-radius:12px;border:0;font-weight:800;cursor:pointer}.g{background:#111;color:#fff}.y{background:#f3f4f6;color:#111}.dep-row{display:flex;gap:6px;flex-wrap:wrap}
.input{width:100%;padding:12px;border-radius:10px;border:1px solid #e5e7eb;margin:6px 0}
</style>
</head><body>
<div class="toast" id="toast"></div>
<div class="header"><div style="display:flex;gap:8px;align-items:center"><div class="b-logo">B</div><b style="font-size:20px">BASHIRI</b></div><div style="display:flex;gap:10px;align-items:center"><span>🔔</span><span style="width:28px;height:28px;border:1px solid #ddd;border-radius:50%;display:flex;align-items:center;justify-content:center">👤</span><span class="badge" id="topBal">KES 0</span></div></div>

<!-- HOME -->
<div id="v-home" class="view active"><div id="homeList"></div></div>

<!-- LOCAL -->
<div id="v-local" class="view"><div id="localList"></div></div>

<!-- FOREX -->
<div id="v-forex" class="view">
  <div class="forex-dark">
    <div class="f-top"><span>Forex & Metals</span><span>🔔 ☰</span></div>
    <div class="f-cards" id="fCards"></div>
    <div class="f-chart-wrap"><canvas id="forexChart"></canvas></div>
    <div class="f-stats"><div>24H High<b id="hHigh">1.08362</b></div><div>24H Low<b id="hLow">1.08012</b></div><div>Volume<b>12.4K</b></div><div>Spread<b>0.8</b></div></div>
    <div style="padding:14px;background:#0f1424"><b>Community Prediction</b>
      <div class="pred-bar"><div class="pred-yes" id="yesBar" style="width:62%">YES 62%</div><div class="pred-no" id="noBar">NO 38%</div></div>
      <div style="display:flex;gap:10px"><button class="btn-sell" onclick="forexBet('NO')">SELL</button><button class="btn-buy" onclick="forexBet('YES')">BUY</button></div>
    </div>
  </div>
</div>

<!-- DETAIL VIEW (Screenshot 2) -->
<div id="v-detail" class="view">
  <div style="padding:10px"><button onclick="sw(lastTab)" style="border:0;background:#fff;padding:8px 12px;border-radius:10px">← Back</button></div>
  <div id="detailContent"></div>
</div>

<!-- WALLET -->
<div id="v-wallet" class="view">
  <div class="card-light"><h3>Wallet • 0116982197</h3><div style="background:#111;color:#fff;padding:12px;border-radius:12px;font-weight:900;margin:8px 0">📞 0116982197</div><div class="dep-row"><button class="dep g" onclick="instantDep(20)">+20</button><button class="dep y" onclick="instantDep(50)">+50</button><button class="dep g" onclick="instantDep(100)">+100</button><button class="dep y" onclick="instantDep(500)">+500</button></div><div style="margin-top:14px"><input id="wdAmt" class="input" type="number" placeholder="Withdraw Amount (Min 100)"><input id="wdPhone" class="input" placeholder="Phone 07..."><button class="dep g" style="width:100%" onclick="withdraw()">Request Withdraw</button></div></div>
</div>

<div class="tabs"><div class="tab active" id="t-home" onclick="sw('home')">📊<br>Markets</div><div class="tab" id="t-local" onclick="sw('local')">🌧️<br>Local</div><div class="tab" id="t-forex" onclick="sw('forex')">📈<br>Forex</div><div class="tab" id="t-wallet" onclick="sw('wallet')">👛<br>Wallet</div></div>

<script>
const SUPABASE_URL = "https://hkhqbtyyqgvaktamilxs.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhraHFidHl5cWd2YWt0YW1pbHhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwMTQwNDQsImV4cCI6MjEwNjU5MDA0NH0.gJcUf9XgzF34sczhD79V9oOnPD7a3XEU-5BXoQHWuAg";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let localBal = parseInt(localStorage.getItem('bashiri_bal')||'0');
let lastTab='home'; let selectedForexId=null; let currentMarkets=[]; let allMarkets=[]; let detailMarket=null; let betAmount=20;
let yesChart, volChart, forexChartObj;
function toast(m){let t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500);}
function sw(v){if(v!=='detail') lastTab=v; document.querySelectorAll('.view').forEach(e=>e.classList.remove('active')); document.getElementById('v-'+v).classList.add('active'); document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active')); let tab=document.getElementById('t-'+(v==='detail'?lastTab:v)); if(tab)tab.classList.add('active');}
function renderBal(){document.getElementById('topBal').innerText='KES '+localBal;}
async function instantDep(a){await sb.from('transactions').insert({type:'deposit',amount:a,mpesa_code:'INSTANT',status:'approved'}); localBal+=a; localStorage.setItem('bashiri_bal',localBal); toast('✅ +'+a+' KES '+localBal); renderBal();}
async function withdraw(){let a=parseInt(document.getElementById('wdAmt').value); let p=document.getElementById('wdPhone').value; if(!a||a<100)return toast('Min 100'); if(a>localBal)return toast('Low balance'); await sb.from('transactions').insert({type:'withdraw',amount:a,phone:p,status:'pending'}); localBal-=a; localStorage.setItem('bashiri_bal',localBal); toast('Withdraw '+a); renderBal();}
function cardLightHTML(m){
  let tot=(m.yes_count||0)+(m.no_count||0)||1; let yp=Math.round((m.yes_count||0)/tot*100); let np=100-yp;
  return `<div class="card-light" onclick="openDetail('${m.id}')">
    <span class="pred-badge">LIVE • PREDICTIONS</span>
    <h3 style="margin:8px 0;font-size:18px">${m.question}</h3>
    <div style="font-size:12px;opacity:.6">Settles at 23:00 EAT • Today, ${new Date().toLocaleDateString()}</div>
    <div style="display:flex;gap:8px;margin:10px 0;justify-content:space-between;align-items:center">
      <div><span class="yes-box">🟢 YES ${yp}%</span> <span class="no-box">🔴 NO ${np}%</span></div>
      <div style="text-align:right"><div style="font-size:12px">Current Pot:</div><div class="pot">KES ${(m.pool||0).toLocaleString()} 💰</div></div>
    </div>
  </div>`;
}
function openDetail(id){
  detailMarket=allMarkets.find(x=>x.id===id);
  if(!detailMarket)return;
  let m=detailMarket; let tot=(m.yes_count||0)+(m.no_count||0)||1; let yp=Math.round((m.yes_count||0)/tot*100); let np=100-yp;
  let yesPool=Math.round((m.pool||0)*yp/100); let noPool=(m.pool||0)-yesPool;
  document.getElementById('detailContent').innerHTML=`
    <div class="card-light">
      <span class="pred-badge">LIVE • PREDICTIONS</span>
      <h2 style="margin:8px 0">${m.question}</h2>
      <div style="font-size:12px;opacity:.6">Settles at 23:00 EAT • Today, ${new Date().toLocaleDateString()}</div>
      <div style="display:flex;gap:8px;margin:12px 0;justify-content:space-between">
        <div><span class="yes-box">🟢 YES ${yp}%</span> <span class="no-box">🔴 NO ${np}%</span></div>
        <div style="text-align:right"><div style="font-size:11px">Current Pot:</div><div class="pot">KES ${(m.pool||0).toLocaleString()} 💰</div></div>
      </div>
    </div>
    <div class="card-light">
      <div style="display:flex;justify-content:space-between;align-items:center"><b>Price — YES vs <span style="color:#dc2626">NO</span></b><div class="time-bar" style="margin:0"><button class="active">1H</button><button>1D</button><button>1W</button><button>1M</button></div></div>
      <div class="chart-box"><canvas id="yesNoChart"></canvas></div>
    </div>
    <div class="card-light">
      <b>Volume</b>
      <div class="volume-bars" id="volBars"></div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <div style="flex:1;background:#dcfce7;border:1px solid #bbf7d0;padding:8px;border-radius:10px;font-size:12px">YES pool: KES ${yesPool} ↑ ${yp}%</div>
        <div style="flex:1;background:#fecaca;border:1px solid #fca5a5;padding:8px;border-radius:10px;font-size:12px">NO pool: KES ${noPool} ↓ ${np}%</div>
      </div>
    </div>
    <div class="bet-box">
      <h3 style="text-align:center;margin-bottom:10px">Place Your Bet</h3>
      <div style="display:flex;justify-content:space-between"><span>Balance:</span><b>KES ${localBal}</b></div>
      <div class="bet-row"><span style="font-size:12px">Place bet (KES)</span><div class="bet-ctrl"><button onclick="changeBet(-10)">−</button><span style="flex:1;text-align:center" id="betAmt">20</span><button onclick="changeBet(10)">+</button><button onclick="changeBet(10)">+</button></div></div>
      <div style="display:flex;gap:10px">
        <button class="bet-btn yes-bet" onclick="doDetailBet('YES')">YES<br>— Bet KES <span class="bAmt">20</span> ✔</button>
        <button class="bet-btn no-bet" onclick="doDetailBet('NO')">NO<br>Bet KES <span class="bAmt">20</span></button>
      </div>
      <div style="font-size:11px;opacity:.6;margin-top:8px;text-align:center">By placing a bet you agree to BASHIRI Terms • Payout if YES is correct: KES ${Math.round(betAmount*1.9)}</div>
    </div>
  `;
  sw('detail');
  setTimeout(()=>{ drawYesNoChart(yp); drawVol(); },100);
}
function changeBet(d){betAmount=Math.max(20,betAmount+d); document.querySelectorAll('.bAmt').forEach(e=>e.innerText=betAmount); document.getElementById('betAmt').innerText=betAmount;}
async function doDetailBet(side){
  if(localBal<betAmount){sw('wallet');return toast('Deposit first');}
  let m=detailMarket;
  let tot=(m.yes_count||0)+(m.no_count||0); let yp=tot?Math.round((m.yes_count/tot)*100):50;
  if(side==='YES'&&yp>=60)return toast('YES capped 60%');
  if(side==='NO'&&yp<=40)return toast('NO capped');
  await sb.from('bets').insert({market_id:m.id,side:side,amount:betAmount});
  if(side==='YES')await sb.from('markets').update({yes_count:(m.yes_count||0)+1,pool:(m.pool||0)+betAmount}).eq('id',m.id);
  else await sb.from('markets').update({no_count:(m.no_count||0)+1,pool:(m.pool||0)+betAmount}).eq('id',m.id);
  localBal-=betAmount; localStorage.setItem('bashiri_bal',localBal); renderBal(); toast('✅ '+side+' KES '+betAmount+' placed!'); loadMarkets(); sw(lastTab);
}
function drawYesNoChart(yp){
  let ctx=document.getElementById('yesNoChart'); if(!ctx)return;
  if(yesChart)yesChart.destroy();
  let data=[]; let base=45; for(let i=0;i<30;i++){base+= (Math.random()-0.45)*3; base=Math.max(30,Math.min(60,base)); data.push(base);}
  data[data.length-1]=yp;
  yesChart=new Chart(ctx,{type:'line',data:{labels:data.map((_,i)=>i),datasets:[{data:data,borderColor:'#2563eb',backgroundColor:'rgba(37,99,235,.15)',fill:true,tension:.4,pointRadius:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{display:false},y:{display:false,min:30,max:60}}}});
}
function drawVol(){
  let el=document.getElementById('volBars'); if(!el)return;
  el.innerHTML=''; for(let i=0;i<30;i++){let h=20+Math.random()*60; let col=Math.random()>0.5?'#22c55e':'#ef4444'; let div=document.createElement('div'); div.className='vb'; div.style.height=h+'%'; div.style.background=col; el.appendChild(div);}
}
function selectForex(id){selectedForexId=id; let m=allMarkets.find(x=>x.id===id); if(m){document.getElementById('yesBar').innerText='YES '+Math.round((m.yes_count||0)/((m.yes_count||0)+(m.no_count||0)||1)*100)+'%';}}
async function forexBet(side){if(!selectedForexId)return toast('Select pair'); let m=allMarkets.find(x=>x.id===selectedForexId); if(localBal<20){sw('wallet');return toast('Deposit 20');} await sb.from('bets').insert({market_id:selectedForexId,side:side,amount:20}); if(side==='YES')await sb.from('markets').update({yes_count:(m.yes_count||0)+1,pool:(m.pool||0)+20}).eq('id',selectedForexId); else await sb.from('markets').update({no_count:(m.no_count||0)+1,pool:(m.pool||0)+20}).eq('id',selectedForexId); localBal-=20; localStorage.setItem('bashiri_bal',localBal); renderBal(); toast('✅ '+side+' 20'); loadMarkets();}
function initForexChart(){
  let ctx=document.getElementById('forexChart'); if(!ctx)return;
  if(forexChartObj)forexChartObj.destroy();
  let d=[1.0820,1.0821,1.0820,1.0818,1.0822,1.0825,1.0828,1.0826,1.0824,1.0827,1.0830,1.0828,1.0832];
  forexChartObj=new Chart(ctx,{type:'line',data:{labels:d.map((_,i)=>i),datasets:[{data:d,borderColor:'#00e676',backgroundColor:'rgba(0,230,118,.1)',fill:true,tension:.3,pointRadius:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{display:false},y:{display:false}}}});
}
async function loadMarkets(){
  let {data:markets}=await sb.from('markets').select('*').order('created_at',{ascending:false});
  if(!markets)return; allMarkets=markets; currentMarkets=markets.filter(m=>m.type==='forex'&&!m.settled);
  if(currentMarkets.length&&!selectedForexId)selectedForexId=currentMarkets[0].id;
  document.getElementById('fCards').innerHTML=currentMarkets.map(x=>`<div class="f-card ${x.id===selectedForexId?'active':''}" onclick="selectForex('${x.id}')"><b>${x.question}</b><br><span class="${x.question.includes('XAU')?'f-down':'f-up'}">${x.question.includes('XAU')?'2035.42':'1.08255'}</span></div>`).join('');
  let home=markets.filter(m=>m.type==='home'&&!m.settled); let local=markets.filter(m=>m.type==='local'&&!m.settled);
  document.getElementById('homeList').innerHTML=home.map(m=>cardLightHTML(m)).join('')||'<div class="card-light">No markets - Admin publish</div>';
  document.getElementById('localList').innerHTML=local.map(m=>cardLightHTML(m)).join('')||'<div class="card-light">No local</div>';
  if(detailMarket){ detailMarket=allMarkets.find(x=>x.id===detailMarket.id)||detailMarket; }
}
renderBal(); initForexChart(); loadMarkets(); setInterval(loadMarkets,5000);
</script></body></html>
