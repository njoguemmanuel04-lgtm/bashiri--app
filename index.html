<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BASHIRI 🔮 Send Money 0116982197</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://s3.tradingview.com/tv.js"></script>
<style>
body{background:#0a0a0a;color:#fff;font-family:system-ui;margin:0;padding:10px}
.top{display:flex;justify-content:space-between;align-items:center;background:#111;padding:12px;border-radius:12px;border:1px solid #222}
.card{background:#111;border:1px solid #222;border-radius:14px;padding:12px;margin:10px 0}
.btn{padding:12px 18px;border-radius:10px;border:0;font-weight:900;cursor:pointer}
.gold{background:#d4af37;color:#000}.dark{background:#222;color:#fff}
.green{background:#00ff88;color:#000}.red{background:#ff184e;color:#fff}
input{width:100%;padding:14px;background:#000;color:#fff;border:1px solid #333;border-radius:10px;margin:8px 0;box-sizing:border-box}
.tab{display:none}.tab.active{display:block}
</style>
</head><body>
<div class="top"><b style="color:#d4af37">BASHIRI 🔮 0116982197</b><b id="bal">Bal: KES 0</b></div>
<div style="display:flex;gap:8px;margin:12px 0">
<button class="btn gold" style="flex:1" onclick="showTab('markets')">Markets</button>
<button class="btn dark" style="flex:1" onclick="showTab('wallet')">Wallet</button>
<button class="btn dark" style="flex:1" onclick="showTab('forex')">Forex 5M</button>
</div>
<div id="tab-markets" class="tab active"><div id="marketsList" class="card">Loading...</div></div>
<div id="tab-wallet" class="tab"><div class="card"><h3>Deposit - Till 0116982197</h3><input id="depAmt" placeholder="Amount"><button class="btn gold" onclick="deposit()">I Paid</button><h3>Withdraw</h3><input id="withAmt" placeholder="Amount"><input id="withPhone" placeholder="07..."><button class="btn dark" onclick="withdraw()">Request Withdraw</button><div id="walletHistory"></div></div></div>
<div id="tab-forex" class="tab">
<div class="card">
<div style="display:flex;justify-content:space-between"><b>EUR/USD REAL 5MIN</b><b id="liveFxPrice" style="color:#00ff88">Loading...</b></div>
<div id="tv" style="height:260px;margin:10px 0"></div>
<input id="fxAmt" value="20" type="number"><small>Min 20 - Win 1.6x (20->32) - 5 MINUTES - REAL PRICE</small>
<div style="display:flex;gap:10px;margin-top:10px"><button class="btn green" style="flex:1" onclick="tradeFx('BUY')">BUY ↑</button><button class="btn red" style="flex:1" onclick="tradeFx('SELL')">SELL ↓</button></div>
</div>
<div class="card"><h3>Active Sessions (5 MIN) - REAL PRICE</h3><div id="fxActive">Loading...</div></div>
<div class="card"><h3>Closed Sessions</h3><div id="fxClosed">Loading...</div></div>
</div>
<script>
const SUPABASE_URL='https://hkhqbtyyqgvaktamilxs.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhraHFidHl5cWd2YWt0YW1pbHhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwMTQwNDQsImV4cCI6MjEwNjU5MDA0NH0.gJcUf9XgzF34sczhD79V9oOnPD7a3XEU-5BXoQHWuAg';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const USER_ID=localStorage.getItem('bashiri_uid')||crypto.randomUUID(); localStorage.setItem('bashiri_uid',USER_ID);
let LIVE_PRICE=1.12087; let currentPair='EUR/USD';
function showTab(t){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById('tab-'+t).classList.add('active');if(t=='markets')loadMarkets();if(t=='forex')initChart();}
async function fetchRealPrice(){try{let r=await fetch('https://open.er-api.com/v6/latest/EUR');let j=await r.json();if(j.rates&&j.rates.USD)LIVE_PRICE=j.rates.USD;document.getElementById('liveFxPrice').innerHTML=LIVE_PRICE.toFixed(5)+' <span style="color:#00ff88">● REAL</span> '+new Date().toLocaleTimeString();}catch(e){}}
setInterval(fetchRealPrice,5000);fetchRealPrice();
function initChart(){new TradingView.widget({autosize:true,symbol:"FX:EURUSD",interval:"1",timezone:"Africa/Nairobi",theme:"dark",style:"1",container_id:"tv",hide_top_toolbar:true});}
async function loadBal(){let {data}=await sb.from('profiles').select('balance').eq('id',USER_ID).single();if(!data){await sb.from('profiles').insert([{id:USER_ID,balance:20}]);data={balance:20};}document.getElementById('bal').innerText='Bal: KES '+data.balance;}
async function loadMarkets(){let {data}=await sb.from('markets').select('*').eq('status','OPEN').order('created_at',{ascending:false});document.getElementById('marketsList').innerHTML=data.map(m=>`<div class="card"><b>${m.title}</b><br><small>${m.category} | OPEN</small><br><div style="display:flex;gap:8px;margin-top:8px"><button class="btn green" onclick="bet('${m.id}','YES',20)">YES</button><button class="btn red" onclick="bet('${m.id}','NO',20)">NO</button></div></div>`).join('')||'No markets';}
async function bet(mid,choice,amt){let {data:prof}=await sb.from('profiles').select('balance').eq('id',USER_ID).single();if(prof.balance<amt)return alert('Low balance');await sb.from('profiles').update({balance:prof.balance-amt}).eq('id',USER_ID);await sb.from('bets').insert([{user_id:USER_ID,market_id:mid,choice:choice,amount:amt,status:'active'}]);loadBal();alert('Bet placed');}
async function tradeFx(type){let amt=parseInt(document.getElementById('fxAmt').value)||20;let {data:prof}=await sb.from('profiles').select('balance').eq('id',USER_ID).single();if(prof.balance<amt)return alert('Low balance KES '+prof.balance);let entry=LIVE_PRICE;await sb.from('profiles').update({balance:prof.balance-amt}).eq('id',USER_ID);await sb.from('bets').insert([{user_id:USER_ID,market_id:'forex-eurusd',choice:type+' '+currentPair+' @ '+entry.toFixed(5),amount:amt,status:'active',entry_price:entry,pair:currentPair,direction:type}]);loadBal();loadFxBets();}
async function loadFxBets(){
 let {data}=await sb.from('bets').select('*').eq('user_id',USER_ID).eq('market_id','forex-eurusd').order('created_at',{ascending:false}).limit(50);
 if(!data)return;let now=Date.now();let active='',closed='';
 for(let b of data){
   let entry=b.entry_price||1.12087; let created=new Date(b.created_at).getTime(); let expiry=created+5*60*1000;
   let leftMs=expiry-now;
   if(b.status=='active' && leftMs<=0){
     let won=(b.direction=='BUY'&&LIVE_PRICE>entry)||(b.direction=='SELL'&&LIVE_PRICE<entry);
     await sb.from('bets').update({status:won?'won':'lost',exit_price:LIVE_PRICE}).eq('id',b.id);
     if(won){let {data:prof}=await sb.from('profiles').select('balance').eq('id',USER_ID).single();await sb.from('profiles').update({balance:prof.balance+Math.floor(b.amount*1.6)}).eq('id',USER_ID);}
     b.status=won?'won':'lost'; b.exit_price=LIVE_PRICE;
   }
   let diff=LIVE_PRICE-entry; let badge='';
   if(b.status=='active'){
     if(Math.abs(diff)<0.00005)badge=`🟡 DRAW (${diff.toFixed(4)})`;
     else if((b.direction=='BUY'&&diff>0)||(b.direction=='SELL'&&diff<0))badge=`🟢 WINNING (${diff>0?'+':''}${diff.toFixed(4)})`;
     else badge=`🔴 LOSING (${diff.toFixed(4)})`;
     let mins=Math.floor(leftMs/60000);let secs=Math.floor((leftMs%60000)/1000); if(mins<0)mins=0; if(secs<0)secs=0;
     active+=`<div class="card" style="border-color:#d4af37"><b>${b.direction} ${b.pair} KES ${b.amount} @ ${entry.toFixed(5)}</b><br><b>${mins}m ${secs}s left</b> - Live ${LIVE_PRICE.toFixed(5)} | ${badge}</div>`;
   } else {
     closed+=`<div class="card" style="border-color:${b.status=='won'?'#00ff88':'#ff184e'};background:${b.status=='won'?'#00ff8811':'#ff184e22'}"><b>${b.status.toUpperCase()} ${b.direction} ${b.pair} ${b.status=='won'?'+'+Math.floor(b.amount*1.6):'-'+b.amount} | Entry ${entry.toFixed(4)} → Exit ${(b.exit_price||LIVE_PRICE).toFixed(4)}</b><br><small>${b.choice}</small></div>`;
   }
 }
 document.getElementById('fxActive').innerHTML=active||'No active'; document.getElementById('fxClosed').innerHTML=closed||'No closed'; loadBal();
}
setInterval(loadFxBets,1000);
loadBal();loadMarkets();loadFxBets();initChart();
async function deposit(){let a=parseInt(document.getElementById('depAmt').value);if(!a)return;alert('Send KES '+a+' to Till 0116982197');}
async function withdraw(){let a=parseInt(document.getElementById('withAmt').value);let p=document.getElementById('withPhone').value;if(!a||!p)return alert('Fill');await sb.from('withdrawals').insert([{user_id:USER_ID,amount:a,phone:p,status:'pending'}]);alert('Withdraw requested');}
</script></body></html>
