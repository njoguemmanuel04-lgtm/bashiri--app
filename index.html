<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#0f0f0f;color:#fff;margin:0;padding:10px}
.card{background:#1e1e1e;border:1px solid #333;border-radius:12px;padding:12px;margin-bottom:12px}
.bot-card{display:flex;justify-content:space-between;align-items:center;background:#2a2a2a;border-radius:8px;padding:8px;margin:6px 0}
.bot-on{color:#00e676;font-weight:bold}.bot-off{color:#888}
.quick{background:#333;color:#fff;border:0;padding:6px 12px;border-radius:6px}
.small{color:#aaa;font-size:11px}
.result-win{color:#00e676}.result-loss{color:#ff5252}
</style>
</head>
<body>

<div class="card">
<b>💰 KES <span id="bal">1000</span></b> | Stake: <input id="stakeInput" type="number" value="50" style="width:70px"> | Last: <span id="lastDigit">5</span>
</div>

<div class="card">
<button onclick="tradeDigit('EVEN')">EVEN 1.9x</button>
<button onclick="tradeDigit('ODD')">ODD 1.9x</button>
<button onclick="tradeOverUnder('OVER',1)">OVER 1 - 1.12x</button>
<button onclick="tradeOverUnder('UNDER',8)">UNDER 8 - 1.12x</button>
</div>

<div class="card" style="border-color:#ff9800">
<b style="color:#ff9800">| EVEN/ODD BOTS</b>
<div class="bot-card"><div><b>🛡️ Safe Bot</b><br><small class="small">Low Risk</small></div><div style="text-align:center"><small id="safeStatus" class="bot-off">OFF</small><br><button class="quick" onclick="toggleBot('safe')">ON/OFF</button></div></div>
<div class="bot-card"><div><b>⚡ Martingale</b><br><small class="small">Medium Risk</small></div><div style="text-align:center"><small id="martStatus" class="bot-off">OFF</small><br><button class="quick" onclick="toggleBot('mart')">ON/OFF</button></div></div>
<div class="bot-card"><div><b>🔥 Aggressive</b><br><small class="small">High Risk</small></div><div style="text-align:center"><small id="aggStatus" class="bot-off">OFF</small><br><button class="quick" onclick="toggleBot('agg')">ON/OFF</button></div></div>
</div>

<div class="card" style="border-color:#00b0ff">
<b style="color:#00b0ff">| OVER 1 / UNDER 8 BOTS</b>
<div class="bot-card"><div><b>🛡️ Safe Bot</b><br><small class="small">Low Risk</small></div><div style="text-align:center"><small id="over1Status" class="bot-off">OFF</small><br><button class="quick" onclick="toggleOverBot('over1')">ON/OFF</button></div></div>
<div class="bot-card"><div><b>⚡ Martingale</b><br><small class="small">Medium Risk</small></div><div style="text-align:center"><small id="over2Status" class="bot-off">OFF</small><br><button class="quick" onclick="toggleOverBot('over2')">ON/OFF</button></div></div>
<div class="bot-card"><div><b>🔥 Aggressive</b><br><small class="small">High Risk</small></div><div style="text-align:center"><small id="over3Status" class="bot-off">OFF</small><br><button class="quick" onclick="toggleOverBot('over3')">ON/OFF</button></div></div>
</div>

<div class="card"><b>RESULTS</b> <button onclick="clearResults()" style="float:right">CLEAR</button><div id="results"></div></div>

<script>
const sb=supabase.createClient('YOUR_URL','YOUR_KEY');
let USER_BAL=1000, lastDigit=5;
let bots={safe:false,mart:false,agg:false}, intervals={};
let overBots={over1:false,over2:false,over3:false}, overIntervals={};

function updateBal(){document.getElementById('bal').innerText=USER_BAL; document.getElementById('lastDigit').innerText=lastDigit}
function saveLocal(b){let a=JSON.parse(localStorage.getItem('bets')||'[]');a.unshift(b);localStorage.setItem('bets',JSON.stringify(a.slice(0,50)))}
function loadAll(){let bets=JSON.parse(localStorage.getItem('bets')||'[]'); document.getElementById('results').innerHTML=bets.map(b=>`<div>${b.market_id} ${b.choice} ${b.result==='WIN'?'<span class="result-win">✅ WIN +'+b.profit+'</span>':'<span class="result-loss">❌ LOSS '+b.profit+'</span>'} - ${b.amount} - D:${b.digit}</div>`).join('');}
function clearResults(){localStorage.removeItem('bets');loadAll()}
function getPayout(type, th){ if(th===1||th===8) return 1.12; return 1.9; }

function toggleBot(n){bots[n]=!bots[n]; document.getElementById(n+'Status').innerText=bots[n]?'ON':'OFF'; document.getElementById(n+'Status').className=bots[n]?'bot-on':'bot-off';
 if(bots[n]){intervals[n]=setInterval(()=>{tradeDigit(Math.random()>0.5?'EVEN':'ODD',true,n)}, n==='agg'?2000:n==='mart'?4000:6000);} else clearInterval(intervals[n]);}

function toggleOverBot(n){overBots[n]=!overBots[n]; document.getElementById(n+'Status').innerText=overBots[n]?'ON':'OFF'; document.getElementById(n+'Status').className=overBots[n]?'bot-on':'bot-off';
 if(overBots[n]){overIntervals[n]=setInterval(()=>{let t=n==='over1'?'OVER':'UNDER'; let th=t==='OVER'?1:8; if(n==='over3'){t=Math.random()>0.5?'OVER':'UNDER'; th=t==='OVER'?1:8;} tradeOverUnder(t,th,true,n)}, n==='over3'?2000:n==='over2'?4000:6000);} else clearInterval(overIntervals[n]);}

async function tradeDigit(type,isBot=false,botName=''){
 let stake=parseInt(document.getElementById('stakeInput').value); if(stake>USER_BAL){if(isBot)toggleBot(botName);return;}
 let d=Math.floor(Math.random()*10); lastDigit=d;
 let win=(type==='EVEN'&&d%2===0)||(type==='ODD'&&d%2===1);
 let payout=1.9; USER_BAL-=stake; if(win)USER_BAL+=stake*payout; updateBal();
 saveLocal({market_id:'EVEN_ODD',choice:type,amount:stake,result:win?'WIN':'LOSS',profit:win?Math.round(stake*(payout-1)):-stake,digit:d}); loadAll();
}

async function tradeOverUnder(type,threshold,isBot=false,botName=''){
 let stake=parseInt(document.getElementById('stakeInput').value); if(stake>USER_BAL){if(isBot)toggleOverBot(botName);return;}
 let d=Math.floor(Math.random()*10); lastDigit=d;
 let win=type==='OVER'?d>threshold:d<threshold;
 let payout=getPayout(type,threshold);
 USER_BAL-=stake; if(win)USER_BAL+=stake*payout; updateBal();
 saveLocal({market_id:'OVER_UNDER',choice:`${type} ${threshold} ${payout}x`,amount:stake,result:win?'WIN':'LOSS',profit:win?Math.round(stake*(payout-1)):-stake,digit:d}); loadAll();
}

setInterval(()=>{lastDigit=Math.floor(Math.random()*10); updateBal();},1500);
updateBal(); loadAll();
</script>
</body>
</html>
