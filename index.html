<!DOCTYPE html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panda Pesa - Pure Forex Real Prices</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://s.tradingview.com/tv.js"></script>
<style>
body{background:#0a0e14;color:#fff;font-family:system-ui;margin:0;padding:0}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#0f141e;border-bottom:1px solid #1e2a3a}
.bal-card{margin:12px;background:linear-gradient(135deg,#0f1e14,#1a2a1e);border:1px solid #2a3f2a;border-radius:16px;padding:16px;display:flex;justify-content:space-between;align-items:center}
.bal-card h1{margin:4px 0;font-size:32px}
.btn-up{background:#00c853;color:#fff;border:none;padding:10px 14px;border-radius:10px;font-weight:800}
.btn-down{background:#ff1744;color:#fff;border:none;padding:10px 14px;border-radius:10px;font-weight:800}
.card{background:#111822;border:1px solid #1e2a3a;border-radius:14px;padding:12px;margin:10px 12px}
.pair-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #1a2332}
#tv_chart{height:45vh;border-radius:12px;border:1px solid #1e2a3a;background:#0a0e14}
.nav{position:fixed;bottom:0;left:0;right:0;background:#0f141e;border-top:1px solid #1e2a3a;display:flex;justify-content:space-around;padding:10px 0;z-index:99}
.tf{padding:6px 10px;border-radius:8px;background:#1a2332;border:1px solid #2a3a4a;color:#aaa;font-size:12px}
.tf.active{background:#00c853;color:#000}
.small{color:#7a8a9a;font-size:11px}
.price-up{color:#00c853} .price-down{color:#ff1744}
input{width:100%;padding:12px;background:#0f141e;border:1px solid #2a3a4a;color:#fff;border-radius:10px;margin:6px 0;box-sizing:border-box}
.btn-gold{background:#d4af37;color:#000;padding:12px;border-radius:10px;border:none;font-weight:800;width:100%}
.live-dot{width:8px;height:8px;background:#00c853;border-radius:50%;display:inline-block;animation:blink 1s infinite}
@keyframes blink{0%{opacity:1}50%{opacity:0.3}100%{opacity:1}}
</style>
</head><body>
<div class="top"><div style="display:flex;align-items:center;gap:8px"><div style="background:#00c853;padding:6px;border-radius:50%">🐼</div><div><b>Panda Pesa</b><br><small class="small">FOREX • PURE • REAL</small></div></div><div id="balTop" style="font-weight:800">KES 20</div></div>
<div class="bal-card"><div><small class="small"><span class="live-dot"></span> Balance • Real Account • KES • Live</small><h1 id="balBig">KES 20.00</h1><small class="small" id="progText">Loading...</small></div><button class="btn-gold" style="width:auto" onclick="show('wallet')">WITHDRAW ALL</button></div>
<div id="view-home">
<div class="card"><div style="display:flex;justify-content:space-between"><b id="chartTitle">EUR/USD • 1H • REAL</b><div><span class="tf active">1H</span></div></div><div id="tv_chart"></div><div style="text-align:center;margin-top:6px"><small class="small" id="livePrice">Connecting to real market...</small></div></div>
<div class="card"><b style="color:#00c853">| FOREX MARKETS</b> <small class="small">• REAL PRICE • 5 MARKETS</small><div id="forexList">Loading real prices...</div></div>
</div>
<div id="view-wallet" style="display:none"><div class="card"><h3>💰 Deposit 0116982197</h3><button class="btn-gold" onclick="alert('Send to 0116982197')">I Have Sent</button></div><div class="card"><h3>💸 Withdraw</h3><input id="withPhone" placeholder="07..."><input id="withAmount" type="number" placeholder="40"><button class="btn-gold" onclick="withdraw()">Withdraw</button><div id="withHistory"></div></div></div>
<div id="view-trade" style="display:none"><div class="card" id="tradeHistory">No trades</div></div>
<div class="nav"><div onclick="show('home')" style="text-align:center"><b>🏠</b><br><small class="small">Home</small></div><div onclick="show('wallet')" style="text-align:center">💼<br><small class="small">Wallet</small></div><div onclick="show('trade')" style="text-align:center">📈<br><small class="small">Trades</small></div><div style="text-align:center">👤<br><small class="small">Profile</small></div></div>
<script>
const SUPABASE_URL='https://hkhqbtyyqgvaktamilxs.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhraHFidHl5cWd2YWt0YW1pbHhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwMTQwNDQsImV4cCI6MjEwNjU5MDA0NH0.gJcUf9XgzF34sczhD79V9oOnPD7a3XEU-5BXoQHWuAg';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let USER_ID=localStorage.getItem('bashiri_uid'); if(!USER_ID){USER_ID=crypto.randomUUID(); localStorage.setItem('bashiri_uid',USER_ID);}
let USER_BAL=20;
let pairs=[
{symbol:"EUR/USD",base:"EUR",quote:"USD",tv:"FX:EURUSD",price:0,prev:0,change:"0%"},
{symbol:"USD/KES",base:"USD",quote:"KES",tv:"FX:USDKES",price:0,prev:0,change:"0%"},
{symbol:"GBP/USD",base:"GBP",quote:"USD",tv:"FX:GBPUSD",price:0,prev:0,change:"0%"},
{symbol:"GOLD",base:"XAU",quote:"USD",tv:"OANDA:XAUUSD",price:0,prev:0,change:"0%",isGold:true},
{symbol:"USD/JPY",base:"USD",quote:"JPY",tv:"FX:USDJPY",price:0,prev:0,change:"0%"}
];
let current="EUR/USD";
async function init(){
let {data:prof}=await sb.from('profiles').select('*').eq('id',USER_ID).maybeSingle();
if(!prof){await sb.from('profiles').insert([{id:USER_ID,balance:20}]);}else{USER_BAL=prof.balance||20}
updateBal(); await fetchAllReal(); renderPairs(); loadTv(current); setInterval(fetchAllReal,4000); loadWithdrawals(); loadTrades();
}
function updateBal(){document.getElementById('balTop').innerText='KES '+USER_BAL; document.getElementById('balBig').innerText='KES '+USER_BAL+'.00'; document.getElementById('progText').innerText=USER_BAL>=40?'✅ Ready to Withdraw':'Grow 20 → 40 ('+USER_BAL+'/40)';}

// REAL PRICE FETCHING
async function fetchRealPrice(p){
try{
if(p.isGold){
// Real Gold from Gold-API (free, no key)
let r=await fetch('https://api.gold-api.com/price/XAU'); let j=await r.json();
return parseFloat(j.price);
}else{
// Real Forex from exchangerate.host (free ECB + Fed)
let r=await fetch(`https://api.frankfurter.app/latest?from=${p.base}&to=${p.quote}`);
let j=await r.json(); 
if(j.rates && j.rates[p.quote]) return j.rates[p.quote];
// fallback to open.er-api
let r2=await fetch(`https://open.er-api.com/v6/latest/${p.base}`);
let j2=await r2.json(); return j2.rates[p.quote];
}
}catch(e){ console.log('price error',p.symbol,e); return p.price||0; }
}
async function fetchAllReal(){
for(let p of pairs){
let newPrice=await fetchRealPrice(p);
if(newPrice){
p.prev=p.price||newPrice;
p.price=newPrice;
let diff=((newPrice-p.prev)/p.prev*100).toFixed(2);
p.change=(diff>=0?'+':'')+diff+'%';
if(p.symbol==='GOLD') p.price=newPrice.toFixed(2);
else p.price=newPrice.toFixed(5);
}
}
renderPairs();
let cp=pairs.find(x=>x.symbol===current);
if(cp) document.getElementById('livePrice').innerHTML=`${current} <span class="${parseFloat(cp.change)>=0?'price-up':'price-down'}">${cp.price} ${cp.change}</span> • <span class="live-dot"></span> REAL • ${new Date().toLocaleTimeString()}`;
}
function renderPairs(){
document.getElementById('forexList').innerHTML=pairs.map(p=>{
let up=parseFloat(p.change)>=0;
return `<div class="pair-row" onclick="selectPair('${p.symbol}')">
<div><b>${p.symbol}</b><br><small class="small">TICK: 1s • REAL • ${p.base}/${p.quote}</small></div>
<div style="text-align:right"><div class="price ${up?'price-up':'price-down'}">${p.price||'...'}</div><small class="small ${up?'price-up':'price-down'}">${p.change}</small></div>
<div style="display:flex;gap:6px;margin-left:10px"><button class="btn-up" onclick="event.stopPropagation();trade('${p.symbol}','UP')">↑ UP 1.8x</button><button class="btn-down" onclick="event.stopPropagation();trade('${p.symbol}','DOWN')">↓ DOWN 1.8x</button></div>
</div>`}).join('');
}
function selectPair(s){current=s; document.getElementById('chartTitle').innerText=s+' • 1H • REAL'; loadTv(s);}
function loadTv(sym){let tv=pairs.find(x=>x.symbol===sym)?.tv||"FX:EURUSD"; document.getElementById('tv_chart').innerHTML=''; new TradingView.widget({autosize:true,symbol:tv,interval:"60",timezone:"Africa/Nairobi",theme:"dark",style:"1",locale:"en",toolbar_bg:"#0a0e14",enable_publishing:false,backgroundColor:"#0a0e14",gridColor:"#1e2a3a",hide_top_toolbar:false,container_id:"tv_chart"});}
async function trade(symbol,dir){
let stake=prompt(`REAL TRADE ${symbol} ${dir} 1.8x\nAmount KES:`, "20"); if(!stake)return; stake=parseInt(stake); if(stake>USER_BAL)return alert('Low balance'); USER_BAL-=stake; updateBal(); await sb.from('profiles').update({balance:USER_BAL}).eq('id',USER_ID); await sb.from('bets').insert([{user_id:USER_ID,market_id:symbol,choice:dir,amount:stake}]); alert(`Trade ${symbol} ${dir} KES ${stake} placed at REAL price ${(pairs.find(x=>x.symbol===symbol)||{}).price}\nWin = x1.8`); loadTrades();
}
async function withdraw(){let phone=document.getElementById('withPhone').value.trim(); let amount=parseInt(document.getElementById('withAmount').value); if(USER_BAL<40)return alert('Need 40'); if(amount<40)return alert('Min 40'); let {error}=await sb.from('withdrawals').insert([{user_id:USER_ID,phone,amount,status:'pending'}]); if(error){alert(error.message);return;} USER_BAL-=amount; updateBal(); await sb.from('profiles').update({balance:USER_BAL}).eq('id',USER_ID); alert('Withdraw requested'); loadWithdrawals();}
async function loadWithdrawals(){let {data}=await sb.from('withdrawals').select('*').eq('user_id',USER_ID).order('created_at',{ascending:false}); document.getElementById('withHistory').innerHTML=(data||[]).map(w=>`<small>${w.amount} to ${w.phone} - ${w.status}</small><br>`).join('')||'';}
async function loadTrades(){let {data}=await sb.from('bets').select('*').eq('user_id',USER_ID).order('created_at',{ascending:false}).limit(20); document.getElementById('tradeHistory').innerHTML='<b>Recent Trades (REAL PRICE)</b><br>'+(data||[]).map(t=>`<small>${t.market_id} ${t.choice} ${t.amount} @ ${new Date(t.created_at).toLocaleTimeString()}</small><br>`).join('')||'No trades';}
function show(v){document.getElementById('view-home').style.display=v==='home'?'block':'none'; document.getElementById('view-wallet').style.display=v==='wallet'?'block':'none'; document.getElementById('view-trade').style.display=v==='trade'?'block':'none'; if(v==='home')setTimeout(()=>loadTv(current),100);}
init();
</script></body></html>
