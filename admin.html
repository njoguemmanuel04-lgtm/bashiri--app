<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADMIN V2</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{background:#050f0d;color:#fff;padding:12px;font-family:monospace} .b{border:1px solid #29b6f6;border-radius:12px;padding:12px;margin-bottom:10px} .err{color:#ff3d57;background:#1a0005;padding:10px;border-radius:8px;margin:10px 0} .ok{color:#00e676}</style></head><body>
<div class="b"><b>BASHIRI ADMIN V2 - DEBUG</b><br><button onclick="test()" style="padding:10px 20px;background:#29b6f6;border:0;border-radius:8px;font-weight:800">TEST CLOUD CONNECTION</button> <span id="st"></span></div>
<div id="log"></div>
<script>
const URL="https://hkhqbtyyqgvaktamilxs.supabase.co";
const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhraHFidHl5cWd2YWt0YW1pbHhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwMTQwNDQsImV4cCI6MjEwNjU5MDA0NH0.gJcUf9XgzF34sczhD79V9oOnPD7a3XEU-5BXoQHWuAg";
const sb=window.supabase.createClient(URL,KEY);
async function test(){
 document.getElementById('log').innerHTML='Testing...';
 document.getElementById('st').innerText='⏳';
 try{
  const r=await fetch(URL+'/rest/v1/bets?select=*&limit=1',{headers:{'apikey':KEY,'Authorization':'Bearer '+KEY}});
  const txt=await r.text();
  document.getElementById('log').innerHTML=`<div class="b">REST STATUS: ${r.status}<br><br>${txt.slice(0,1000)}</div>`;
  if(r.ok){
   document.getElementById('st').innerHTML='<span class="ok">● CLOUD OK</span>';
   load();
  } else {
   document.getElementById('st').innerHTML='<span class="err">● ERROR '+r.status+'</span>';
  }
 }catch(e){
  document.getElementById('log').innerHTML=`<div class="err">FETCH FAILED: ${e.message}<br><br>This is Supabase outage - check status.supabase.com<br>Your URL: ${URL}<br>Try switch to WiFi / VPN, some KE ISPs block Supabase</div>`;
  document.getElementById('st').innerHTML='● OFFLINE';
 }
}
async function load(){
 const {data,error}=await sb.from('bets').select('*').order('created_at',{ascending:false}).limit(20);
 if(error){document.getElementById('log').innerHTML+=`<div class="err">SB Error: ${error.message}</div>`; return;}
 document.getElementById('log').innerHTML+=`<div class="b"><b>${data.length} bets in cloud</b><br>${data.map(b=>`${b.bot_name} ${b.choice} ${b.result} ${b.player_profit}<br>`).join('')}</div>`;
}
test();
</script></body></html>
