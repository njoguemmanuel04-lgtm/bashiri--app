<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bashiri Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<style>
body{background:#0f1115;color:#fff;font-family:system-ui;padding:15px}
input,select,button{padding:12px;margin:5px;border-radius:10px;border:none}
input{background:#222;color:#fff;width:70%}
button{background:#00c853;color:#fff;font-weight:800;cursor:pointer}
.card{background:#1e1e1e;padding:12px;margin:10px 0;border-radius:10px;border-left:4px solid #00c853}
.tab{padding:10px;background:#222;margin:3px;border-radius:8px;cursor:pointer;display:inline-block}
.tab.active{background:#00c853}
</style>
</head>
<body>
<div id="loginDiv" style="text-align:center;margin-top:80px">
<h2>🔐 BASHIRI ADMIN</h2>
<input id="pin" type="password" placeholder="011698" style="width:200px;text-align:center"><br><br>
<button onclick="login()" style="width:220px">LOGIN</button>
</div>
<div id="adminDiv" style="display:none">
<h2>💼 ADMIN - Till 0116982197</h2>
<div>
<span class="tab active" id="tabDep" onclick="showTab('dep')">Deposits</span>
<span class="tab" id="tabBet" onclick="showTab('bet')">Bets</span>
<span class="tab" id="tabMark" onclick="showTab('mark')">Markets</span>
<span class="tab" id="tabUsers" onclick="showTab('users')">Users</span>
<button style="background:#ff1744;float:right" onclick="location.reload()">Logout</button>
</div>
<div id="depDiv"><h3>Deposits</h3><div id="depList"></div></div>
<div id="betDiv" style="display:none"><h3>Bets</h3><div id="betList"></div></div>
<div id="markDiv" style="display:none"><h3>Create Market</h3><input id="mTitle" placeholder="Will it rain in mwea tomorrow?"><select id="mStatus"><option value="open">OPEN</option><option value="closed">CLOSED</option></select><button onclick="createMarket()">Create +</button><div id="markList"></div></div>
<div id="usersDiv" style="display:none"><h3>Users</h3><div id="usersList"></div></div>
</div>
<script>
const SUPA_URL="https://hkhqbtyyqgvaktamilxs.supabase.co";
const SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhraHFidHl5cWd2YWt0YW1pbHhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwMTQwNDQsImV4cCI6MjEwNjU5MDA0NH0.gJcUf9XgzF34sczhD79V9oOnPD7a3XEU-5BXoQHWuAg";
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);
function login(){if(document.getElementById('pin').value==='011698'){document.getElementById('loginDiv').style.display='none';document.getElementById('adminDiv').style.display='block';loadAll();}else alert('Wrong PIN');}
function showTab(t){document.getElementById('depDiv').style.display=t==='dep'?'block':'none';document.getElementById('betDiv').style.display=t==='bet'?'block':'none';document.getElementById('markDiv').style.display=t==='mark'?'block':'none';document.getElementById('usersDiv').style.display=t==='users'?'block':'none';document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));document.getElementById('tab'+(t==='dep'?'Dep':t==='bet'?'Bet':t==='mark'?'Mark':'Users')).classList.add('active');}
function loadAll(){loadDeposits();loadBets();loadMarkets();loadUsers();}
async function loadDeposits(){let{data}=await sb.from('deposits').select('*').eq('status','pending').order('created_at',{ascending:false});document.getElementById('depList').innerHTML=!data||!data.length?'No pending':data.map(d=>`<div class="card">${d.phone||d.user_id} - KES ${d.amount}<br><button onclick="approveDep('${d.id}','${d.user_id}',${d.amount})">Approve</button> <button style="background:#ff1744" onclick="rejectDep('${d.id}')">Reject</button></div>`).join('');}
async function approveDep(id,uid,amt){let{data:u}=await sb.from('profiles').select('balance').eq('id',uid).single();await sb.from('profiles').update({balance:(u?.balance||0)+amt}).eq('id',uid);await sb.from('deposits').update({status:'approved'}).eq('id',id);loadDeposits();}
async function rejectDep(id){await sb.from('deposits').update({status:'rejected'}).eq('id',id);loadDeposits();}
async function loadBets(){let{data}=await sb.from('bets').select('*').eq('status','open').order('created_at',{ascending:false});document.getElementById('betList').innerHTML=!data||!data.length?'No bets':data.map(b=>`<div class="card">${b.market_title||b.selection} KES ${b.amount}<br><button onclick="settleBet('${b.id}','${b.user_id}',${b.amount},${b.profit||Math.floor(b.amount*0.6)},'won')">WIN</button> <button style="background:#ff1744" onclick="settleBet('${b.id}','${b.user_id}',0,0,'lost')">LOSE</button></div>`).join('');}
async function settleBet(bid,uid,amt,pr,st){if(st==='won'){let{data:u}=await sb.from('profiles').select('balance').eq('id',uid).single();await sb.from('profiles').update({balance:(u?.balance||0)+amt+pr}).eq('id',uid);}await sb.from('bets').update({status:st}).eq('id',bid);loadBets();}
async function loadMarkets(){let{data}=await sb.from('markets').select('*').order('created_at',{ascending:false}).limit(20);document.getElementById('markList').innerHTML=data?data.map(m=>`<div class="card">${m.title} - ${m.status}</div>`).join(''):'';}
async function createMarket(){let t=document.getElementById('mTitle').value.trim();if(!t)return alert('Enter title');let s=document.getElementById('mStatus').value;let{error}=await sb.from('markets').insert([{title:t,question:t,type:'custom',status:s}]);if(error)return alert(error.message);document.getElementById('mTitle').value='';loadMarkets();alert('Market Created: '+t);}
async function loadUsers(){let{data}=await sb.from('profiles').select('*').limit(50);document.getElementById('usersList').innerHTML=data?data.map(u=>`<div class="card">${u.id.slice(0,8)} - KES ${u.balance||0}</div>`).join(''):'';}
</script>
</body>
</html>
