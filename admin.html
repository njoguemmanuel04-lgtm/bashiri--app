<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>BASHIRI HQ v3 BOT LEADERBOARD</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#0a0a0a;color:#fff;padding:10px}.card{background:#1a1a1a;border:1px solid #333;border-radius:16px;padding:12px;margin-bottom:8px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.tog{border:1px solid #333;background:#222;color:#fff;padding:10px 14px;border-radius:12px;font-weight:800;cursor:pointer}.botRow{background:#222;border-radius:12px;padding:10px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;border-left:4px solid #00e676}.botRow.loss{border-left-color:#ff5252}</style></head>
<body>
<div style="display:flex;justify-content:space-between"><div><h2>🏦 BASHIRI HQ v3</h2><small id="status" style="color:#00ff88">● LIVE</small> <small id="time" style="color:#888"></small></div><button class="tog" onclick="load()">REFRESH</button></div>

<div class="grid3" style="margin-top:10px">
<div class="card" style="border-color:#00e676"><small>HOUSE PROFIT</small><div style="font-size:24px;font-weight:800;color:#00e676" id="house">KES 0</div><small id="houseSub">0 bets</small></div>
<div class="card"><small>VOLUME</small><div style="font-size:20px;font-weight:800" id="vol">KES 0</div></div>
<div class="card"><small>WIN RATE</small><div style="font-size:20px;font-weight:800" id="wr">0%</div><small id="wrSub"></small></div>
</div>

<div class="card"><h3>🤖 EACH BOT PROFIT (per phone)</h3><small style="color:#888">HOUSE + = you won from that bot. HOUSE - = bot beating you</small><div id="bots" style="margin-top:10px"></div></div>

<div class="card"><b>LIVE BETS</b><div id="list" style="margin-top:10px"></div></div>

<script>
const URL="https://hkhqbtyyqgvaktamilxs.supabase.co";
const ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhraHFidHl5cWd2YWt0YW1pbHhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwMTQwNDQsImV4cCI6MjEwNjU5MDA0NH0.gJcUf9XgzF34sczhD79V9oOnPD7a3XEU-5BXoQHWuAg";
const supa=window.supabase.createClient(URL,ANON);
let all=[];
async function load(){
 document.getElementById('time').innerText=new Date().toLocaleTimeString();
 let {data}=await supa.from('bets').select('*').order('created_at',{ascending:false}).limit(500);
 all=data||[];
 let house=0,vol=0,wins=0,cnt=0;
 let byPhone={};
 all.forEach(b=>{
  if(!b.stake||Number(b.stake)<=0) return;
  let stake=Number(b.stake), payout=Number(b.payout)||0;
  let playerProfit=b.win? payout-stake : -stake;
  house+=-playerProfit; vol+=stake; if(b.win) wins++; cnt++;
  let p=(b.phone||'unknown'); if(!byPhone[p]) byPhone[p]={phone:p,bets:0,wins:0,player:0,house:0,stake:0,last:b.created_at};
  byPhone[p].bets++; if(b.win) byPhone[p].wins++; byPhone[p].player+=playerProfit; byPhone[p].house+=-playerProfit; byPhone[p].stake+=stake; byPhone[p].last=b.created_at;
 });
 document.getElementById('house').innerText='KES '+house; document.getElementById('houseSub').innerText=cnt+' bets';
 document.getElementById('vol').innerText='KES '+vol; document.getElementById('wr').innerText=(cnt? (wins/cnt*100).toFixed(1):0)+'%';
 document.getElementById('wrSub').innerText=wins+'W / '+(cnt-wins)+'L'; document.getElementById('status').innerText='● LIVE '+cnt+' bets';

 let arr=Object.values(byPhone).sort((a,b)=>b.house-a.house);
 document.getElementById('bots').innerHTML=arr.map(x=>{
  let wr=x.bets? (x.wins/x.bets*100).toFixed(1):0; let cls=x.house>=0?'':'loss'; let col=x.house>=0?'#00e676':'#ff5252';
  return `<div class="botRow ${cls}"><div><b>${x.phone}</b><br><small>${x.bets} bets • ${wr}% win • Vol ${x.stake}</small><br><small style="color:#666">${new Date(x.last).toLocaleTimeString()}</small></div><div style="text-align:right"><div style="font-weight:800;color:${col}">HOUSE ${x.house>=0?'+':''}${x.house}</div><small>Player ${x.player>=0?'+':''}${x.player}</small><br><small>${x.wins}W-${x.bets-x.wins}L</small></div></div>`
 }).join('')||'<small style="color:#666">No bot bets yet</small>';

 document.getElementById('list').innerHTML=all.filter(b=>b.stake>0).slice(0,100).map(b=>{
  let tm=new Date(b.created_at).toLocaleTimeString(); let pp=b.win? (b.payout-b.stake): -b.stake;
  return `<div style="display:flex;justify-content:space-between;padding:7px;background:#222;margin-bottom:4px;border-radius:8px;font-size:12px;border-left:3px solid ${pp>=0?'#00e676':'#ff5252'}"><span>${tm} ${String(b.phone).slice(-4)} ${b.choice} D:${b.digit} ${b.win?'WIN':'LOSS'}</span><b style="color:${pp>=0?'#00e676':'#ff5252'}">${pp>=0?'+':''}${pp}</b></div>`
 }).join('');
}
load(); setInterval(load,3000);
</script></body></html>
